name: Publish Nooklet interface update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack Nooklet source
        run: mkdir nooklet-source && unzip -q nooklet-source.zip -d nooklet-source
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nooklet-source/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nooklet-source
      - name: Check private release settings
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Set the VITE_SUPABASE_URL Actions secret." && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Set the VITE_SUPABASE_ANON_KEY Actions secret." && exit 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build interface
        run: npm run build
        working-directory: nooklet-source
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Package and checksum interface
        run: |
          cd nooklet-source/dist
          zip -qr ../../nooklet-ui.zip .
          cd ../..
          shasum -a 256 nooklet-ui.zip | awk '{print $1}' > nooklet-ui.zip.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nooklet ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            nooklet-ui.zip
            nooklet-ui.zip.sha256
